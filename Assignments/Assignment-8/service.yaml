apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: streamlit-web # Must match deployment template labels
  ports:
    - name: web
      protocol: TCP
      port: 80         # Internal port inside cluster
      targetPort: 8501 # Port container is listening on
      nodePort: 30085  # External access port (30000-32767)
