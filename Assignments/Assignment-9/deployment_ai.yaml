apiVersion: apps/v1
kind: Deployment
metadata:
  name: personacanvas-backend
  labels:
    app: image-generator
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: image-generator
  template:
    metadata:
      labels:
        app: image-generator
    spec:
      containers:
      - name: generator-core
        image: almond/stylegan-inference:latest # Mock/Standard backend inference image
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
            # If your minikube has GPU, uncomment below lines
            # nvidia.com/gpu: 1
          limits:
            cpu: "1000m"
            memory: "1Gi"
            # nvidia.com/gpu: 1
