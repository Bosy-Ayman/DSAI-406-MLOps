apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  type: ClusterIP      # Internal only access (default type)
  selector:
    app: image-generator # Must match labels in deployment_ai.yaml
  ports:
    - name: api
      protocol: TCP
      port: 5000         # Port exposed internally
      targetPort: 5000   # Backend container port
